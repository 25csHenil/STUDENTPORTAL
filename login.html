<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Hub Portal - Login</title>

    <style>
        /* Reset & Base Styles */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f4f7fc;
            color: #222;
        }

        /* Accessibility: Skip Navigation Link */
        .skip-link {
            position: absolute;
            top: -40px;
            left: 0;
            background: #005bea;
            color: #ffffff;
            padding: 10px 15px;
            z-index: 100;
            text-decoration: none;
            font-weight: bold;
            border-bottom-right-radius: 8px;
            transition: top 0.2s ease;
        }

        .skip-link:focus {
            top: 0;
            outline: 3px solid #00c6fb;
        }

        /* Header */
        header {
            background: linear-gradient(135deg, #005bea, #00c6fb);
            color: white;
            text-align: center;
            padding: 35px;
        }

        header h1 {
            font-size: 40px;
        }

        header p {
            margin-top: 10px;
            font-size: 18px;
        }

        /* Navigation */
        nav {
            background: #111;
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
        }

        nav a {
            color: white;
            text-decoration: none;
            padding: 15px 18px;
            transition: .3s;
        }

        nav a:hover,
        nav a:focus {
            background: #00c6fb;
            color: black;
            outline: none;
        }

        /* Active Page State */
        nav a[aria-current="page"] {
            background: #005bea;
            font-weight: bold;
        }

        /* Main Container */
        .container {
            width: 85%;
            margin: 50px auto;
        }

        /* Login Card */
        .login-box {
            width: 400px;
            max-width: 100%;
            background: white;
            padding: 35px;
            margin: auto;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, .15);
        }

        .login-box h2 {
            text-align: center;
            color: #005bea;
            margin-bottom: 25px;
        }

        /* Form Group & Labels */
        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 5px;
            color: #333;
        }

        input {
            width: 100%;
            padding: 14px;
            border: 1px solid #ccc;
            border-radius: 25px;
            outline: none;
            font-size: 16px;
        }

        input:focus {
            border-color: #005bea;
            box-shadow: 0 0 10px #00c6fb;
        }

        /* Button */
        button {
            width: 100%;
            padding: 14px;
            margin-top: 15px;
            border: none;
            border-radius: 30px;
            background: linear-gradient(135deg, #005bea, #00c6fb);
            color: white;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s;
        }

        button:hover,
        button:focus {
            background: #003f9e;
            outline: none;
        }

        /* Footer Links */
        .links {
            text-align: center;
            margin-top: 20px;
        }

        .links p {
            margin-bottom: 10px;
        }

        .links a {
            color: #005bea;
            text-decoration: none;
            font-weight: bold;
        }

        .links a:hover,
        .links a:focus {
            text-decoration: underline;
        }

        /* Footer */
        footer {
            background: #111;
            color: white;
            text-align: center;
            padding: 20px;
            margin-top: 40px;
        }

        /* Mobile Responsive */
        @media(max-width: 700px) {
            nav a {
                width: 100%;
                text-align: center;
            }

            header h1 {
                font-size: 30px;
            }

            .container {
                width: 95%;
            }
        }
    </style>
</head>

<body>

        <h1>🔐 Student Login</h1>
        <p>Access your Student Hub Portal account</p>
    </header>

    <nav aria-label="Main Navigation">

        <a href="about.html">About</a>

        <a href="login.html" aria-current="page">Login</a>
        <a href="dashboard.html">Dashboard</a>
        <a href="events.html">Events</a>
        <a href="profile.html">Profile</a>
        <a href="contact.html">Contact</a>
        <a href="admin.html">Admin</a>
        <a href="faq.html">FAQ</a>
        <a href="feedback.html">Feedback</a>
    </nav>

                </div>

                <div class="form-group">
                    <label for="password">Password:</label>
                    <input type="password" id="password" name="password" placeholder="Enter Password" required>
                </div>
