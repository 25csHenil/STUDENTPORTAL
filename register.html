<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Hub Portal - Register</title>

    <style>
        /* Reset & Base Styles */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f4f7fc;
            color: #222;
        }

        /* Accessibility: Skip Navigation Link */
        .skip-link {
            position: absolute;
            top: -40px;
            left: 0;
            background: #005bea;
            color: #ffffff;
            padding: 10px 15px;
            z-index: 100;
            text-decoration: none;
            font-weight: bold;
            border-bottom-right-radius: 8px;
            transition: top 0.2s ease;
        }

        .skip-link:focus {
            top: 0;
            outline: 3px solid #00c6fb;
        }

        /* Header */
        header {
            background: linear-gradient(135deg, #005bea, #00c6fb);
            color: white;
            text-align: center;
            padding: 35px;
        }

        header h1 {
            font-size: 40px;
        }

        header p {
            margin-top: 10px;
            font-size: 18px;
        }

        /* Navigation */
        nav {
            background: #111;
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
        }

        nav a {
            color: white;
            text-decoration: none;
            padding: 15px 18px;
            transition: .3s;
        }

        nav a:hover,
        nav a:focus {
            background: #00c6fb;
            color: black;
            outline: none;
        }

        /* Active Page State */
        nav a[aria-current="page"] {
            background: #005bea;
            font-weight: bold;
        }

        /* Main Container */
        .container {
            width: 85%;
            margin: 40px auto;
        }

        /* Registration Card */
        .card {
            background: white;
            width: 450px;
            max-width: 100%;
            margin: auto;
            padding: 35px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, .15);
        }

        .card h2 {
            text-align: center;
            color: #005bea;
            margin-bottom: 25px;
        }

        /* Form Group & Labels */
        .form-group {
            margin-bottom: 12px;
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 5px;
            color: #333;
        }

        input,
        select {
            width: 100%;
            padding: 14px;
            border: 1px solid #ccc;
            border-radius: 25px;
            outline: none;
            font-size: 16px;
            background-color: #fff;
        }

        input:focus,
        select:focus {
            border-color: #005bea;
            box-shadow: 0 0 8px #00c6fb;
        }

        /* Button */
        button {
            width: 100%;
            padding: 14px;
            margin-top: 15px;
            border: none;
            border-radius: 30px;
            background: linear-gradient(135deg, #005bea, #00c6fb);
            color: white;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s;
        }

        button:hover,
        button:focus {
            background: #003f9e;
            outline: none;
        }

        /* Login Link Block */
        .login-link {
            text-align: center;
            margin-top: 20px;
        }

        .login-link a {
            color: #005bea;
            text-decoration: none;
            font-weight: bold;
        }

        .login-link a:hover,
        .login-link a:focus {
            text-decoration: underline;
        }

        /* Footer */
        footer {
            background: #111;
            color: white;
            text-align: center;
            padding: 20px;
            margin-top: 40px;
        }

        /* Responsive Styles */
        @media(max-width:700px) {
            nav a {
                width: 100%;
                text-align: center;
            }

            header h1 {
                font-size: 30px;
            }

            .container {
                width: 95%;
            }
        }
    </style>
</head>

<body>

    <a href="#main-content" class="skip-link">Skip to main content</a>

    <header role="banner">
        <h1>📝 Student Registration</h1>
        <p>Create your Student Hub Portal account</p>
    </header>

    <nav aria-label="Main Navigation">
        <a href="index.html">Home</a>
        <a href="about.html">About</a>
        <a href="register.html" aria-current="page">Register</a>
        <a href="login.html">Login</a>
        <a href="dashboard.html">Dashboard</a>
        <a href="events.html">Events</a>
        <a href="profile.html">Profile</a>
        <a href="contact.html">Contact</a>
        <a href="admin.html">Admin</a>
        <a href="faq.html">FAQ</a>
        <a href="feedback.html">Feedback</a>
    </nav>

    <main id="main-content" class="container">

        <section class="card">

            <h2>Create Account</h2>

            <form action="#" method="post">

                <div class="form-group">
                    <label for="fullname">Full Name:</label>
                    <input type="text" id="fullname" name="fullname" placeholder="Enter your full name" required>
                </div>

                <div class="form-group">
                    <label for="email">Email Address:</label>
                    <input type="email" id="email" name="email" placeholder="Enter your email address" required>
                </div>

                <div class="form-group">
                    <label for="studentid">Student ID:</label>
                    <input type="text" id="studentid" name="studentid" placeholder="Enter your student ID" required>
                </div>

                    <label for="course">Select Course:</label>
                    <select id="course" name="course" required>

                        <option value="BCA">BCA</option>
                        <option value="BBA">BBA</option>
                        <option value="BTech">B.Tech</option>
                        <option value="MCA">MCA</option>
                    </select>
